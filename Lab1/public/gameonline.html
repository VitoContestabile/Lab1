<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plappy Pird - Online Game</title>
    <script src="/env.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            background-color: skyblue;
        }

        canvas {
            display: block;
        }

        #opponent {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px; /* Tamaño fijo para el canvas del oponente */
            height: 250px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 3px solid white;
            border-radius: 10px;
            overflow: hidden; /* Asegura que el contenido no se desborde */
        }

        #game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 0 black;
            font-size: 14px;
        }

        .player-info {
            margin-bottom: 5px;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: white;
            text-shadow: 4px 4px 0 black;
            display: none;
        }

        #winner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: gold;
            text-shadow: 4px 4px 0 black;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<canvas id="board"></canvas>
<canvas id="opponent"></canvas>
<div id="game-info">
    <div class="player-info">Tú: <span id="player-score">0</span></div>
    <div class="player-info">Rival: <span id="opponent-score">0</span></div>
</div>
<div id="countdown">3</div>
<div id="winner"></div>

<script>
    const BASE_URL = window.ENV?.BASE_URL || 'http://localhost:3000';
    const WS_URL = window.ENV?.WS_URL || 'localhost:3000';

    // Variables globales para WebSocket
    let socket;
    let lobbyId = localStorage.getItem("lobbyId");
    let token = localStorage.getItem("token");
    let userId;
    let isHost = false;
    let opponentId;
    let gameRunning = false;
    let localGameOver = false;
    let bothPlayersReady = false;
    let opponentGameOver = false;

    // Parseamos el token para obtener el userId
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // Inicializar datos del jugador
    const userData = parseJwt(token);
    if (userData) {
        userId = userData.userId;
        console.log("✅ UserId obtenido:", userId);
    } else {
        console.error("❌ No hay token válido");
        // Redirigir si no hay token válido
        // window.location.href = 'WebMenu.html';
    }

    // Variables del juego principal
    const board = document.getElementById("board");
    const ctx = board.getContext("2d");
    let boardWidth = window.innerWidth;
    let boardHeight = window.innerHeight;
    board.width = boardWidth;
    board.height = boardHeight;

    // Variables del canvas del oponente
    const opponentCanvas = document.getElementById("opponent");
    const opponentCtx = opponentCanvas.getContext("2d");
    const OPPONENT_CANVAS_WIDTH = 150; // Constantes para el tamaño del canvas del oponente
    const OPPONENT_CANVAS_HEIGHT = 250;
    opponentCanvas.width = OPPONENT_CANVAS_WIDTH;
    opponentCanvas.height = OPPONENT_CANVAS_HEIGHT;

    // Bird
    let bird = {
        x: boardWidth / 8,
        y: boardHeight / 2,
        width: 45,
        height: 45,
        imgSrc: null
    };
    let opponentBird = {
        x: OPPONENT_CANVAS_WIDTH / 8, // Ajustado a la escala del canvas del oponente
        y: OPPONENT_CANVAS_HEIGHT / 2, // Ajustado a la escala del canvas del oponente
        width: 20,
        height: 20,
        imgSrc: null
    };
    let velocityY = 0;
    let gravity = 0.23;

    // Pipes
    let pipeArray = [];
    let pipeWidth = 64;
    let pipeHeight = 512;
    let openingSpace = 250;
    let pipeX = boardWidth; // Inicializado para que las tuberías salgan desde el borde derecho

    // Mini pipes para el canvas del oponente
    let opponentPipeArray = [];

    // Imágenes
    let birdImg = new Image();
    let opponentBirdImg = new Image();
    let topPipeImg = new Image(); // Ahora se cargará dinámicamente
    let bottomPipeImg = new Image(); // Ahora se cargará dinámicamente
    let backgroundImg = new Image(); // Imagen para el fondo del jugador local

    // Nuevas imágenes para el oponente
    let opponentTopPipeImg = new Image(); // Para las tuberías del oponente
    let opponentBottomPipeImg = new Image(); // Para las tuberías del oponente
    let opponentBackgroundImg = new Image(); // Para el fondo del oponente

    // Background
    let background = "skyblue"; // Puede ser un color o una imagen para el jugador local
    let backgroundX = 0; // Posición X del fondo para el scrolling (jugador local)

    // Background del oponente
    let opponentBackground = "skyblue"; // Puede ser un color o una imagen para el oponente
    let opponentBackgroundX = 0; // Posición X del fondo para el scrolling (oponente)


    // Cargar skin del pájaro
    async function loadBirdSkin(userId) {
        try {
            const res = await fetch(`${BASE_URL}/shop/get-current-skin-image`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ userId: userId })
            });

            const data = await res.json();
            console.log("🎨 Skin cargada desde API para", userId, ":", data.image_url);
            return data.image_url;
        } catch (error) {
            console.error("❌ Error cargando skin para", userId, ":", error);
            return "../assets/flappybird.png"; // Imagen de placeholder
        }
    }

    // Nueva función: Cargar skin de tubería
    async function loadPipeSkin(userId) {
        try {
            const res = await fetch(`${BASE_URL}/shop/get-current-pipe-image`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ userId: userId })
            });

            const data = await res.json();
            console.log("🎨 Skin de tubería cargada desde API para", userId, ":", data.image_url);
            return data.image_url;
        } catch (error) {
            console.error("❌ Error cargando skin de tubería para", userId, ":", error);
            return "./assets/bottompipe.png"; // Imagen de placeholder
        }
    }

    // Nueva función: Cargar skin de fondo
    async function loadBackgroundSkin(userId) {
        try {
            const res = await fetch(`${BASE_URL}/shop/get-current-background-image`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ userId: userId })
            });

            const data = await res.json();
            console.log("🎨 Skin de fondo cargada desde API para", userId, ":", data.image_url);
            return data.image_url;
        } catch (error) {
            console.error("❌ Error cargando skin de fondo para", userId, ":", error);
            return null; // Retorna null para usar el color por defecto
        }
    }

    // Juego
    let velocityX = -2;
    let gameOver = false;
    let score = 0;
    let pipeInterval;
    let countdown = 3;
    let countdownTimer;

    // Inicializar WebSocket y configurar conexión
    function initWebSocket() {
        console.log("🔌 Iniciando conexión WebSocket...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsURL = `wss://${WS_URL}/ws/game/${lobbyId}?token=${token}`;

        socket = new WebSocket(wsURL);

        socket.onopen = () => {
            console.log("✅ Conexión WebSocket establecida");
            // Enviar mensaje de jugador listo
            socket.send(JSON.stringify({
                type: "PLAYER_READY",
                userId: userId,
                lobbyId: lobbyId
            }));

            // Resetear contador de reconexión
            reconnectAttempts = 0;
        };

        socket.onmessage = (event) => {
            handleWebSocketMessage(event);
        };

        socket.onerror = (error) => {
            console.error("❌ Error en WebSocket:", error);
            showConnectionMessage("Error de conexión.");

        };

        socket.onclose = (event) => {
            console.log("🔌 Conexión WebSocket cerrada:", event.code, event.reason);

            // Mostrar mensaje al usuario
            if (!gameRunning) {
                showConnectionMessage("Conexión cerrada.");
            }
        };
    }

    // Variables para manejo de reconexión
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;
    let reconnectTimeout;
    let manualDisconnect = false;

    // Función para mostrar mensajes de conexión al usuario
    function showConnectionMessage(message) {
        let msgElement = document.getElementById("connection-message");
        if (!msgElement) {
            msgElement = document.createElement("div");
            msgElement.id = "connection-message";
            msgElement.style.position = "absolute";
            msgElement.style.top = "50%";
            msgElement.style.left = "50%";
            msgElement.style.transform = "translate(-50%, -50%)";
            msgElement.style.backgroundColor = "rgba(0, 0, 0, 0.7)";
            msgElement.style.color = "white";
            msgElement.style.padding = "20px";
            msgElement.style.borderRadius = "10px";
            msgElement.style.fontFamily = "'Press Start 2P', cursive";
            msgElement.style.textAlign = "center";
            msgElement.style.zIndex = "1000";
            document.body.appendChild(msgElement);
        }

        msgElement.textContent = message;
        msgElement.style.display = "block";
    }

    // Ocultar mensaje de conexión
    function hideConnectionMessage() {
        const msgElement = document.getElementById("connection-message");
        if (msgElement) {
            msgElement.style.display = "none";
        }
    }

    // Manejar mensajes recibidos por WebSocket
    function handleWebSocketMessage(event) {
        const message = JSON.parse(event.data);
        console.log("📨 Mensaje recibido:", message);

        // Ocultar mensaje de conexión si estaba visible
        hideConnectionMessage();

        switch (message.type) {
            case "LOBBY_INFO":
                isHost = String(message.hostId) === String(userId);
                opponentId = isHost ? message.guestId : message.hostId;
                console.log(`ℹ️ LOBBY_INFO: userId=${userId}, hostId=${message.hostId}, guestId=${message.guestId}. Soy Host: ${isHost}. Oponente ID: ${opponentId}`);

                // Cargar skin del oponente
                loadBirdSkin(opponentId).then(imageUrl => {
                    if (imageUrl) {
                        opponentBirdImg.src = imageUrl;
                        opponentBird.imgSrc = imageUrl;
                        console.log(`🎨 LOBBY_INFO: Imagen del pájaro del oponente asignada: ${imageUrl}`);
                    } else {
                        console.warn("⚠️ LOBBY_INFO: No se recibió URL de imagen para el oponente o falló la carga.");
                    }
                }).catch(error => {
                    console.error("❌ LOBBY_INFO: Error cargando skin del pájaro del oponente:", error);
                });

                // Cargar skin de tubería del oponente
                loadPipeSkin(opponentId).then(imageUrl => {
                    if (imageUrl) {
                        opponentBottomPipeImg.src = imageUrl;
                        opponentTopPipeImg.src = imageUrl; // Usamos la misma imagen para ambas
                        console.log(`🎨 LOBBY_INFO: Imagen de tubería del oponente asignada: ${imageUrl}`);
                    } else {
                        console.warn("⚠️ LOBBY_INFO: No se recibió URL de imagen de tubería para el oponente.");
                    }
                }).catch(error => {
                    console.error("❌ LOBBY_INFO: Error cargando skin de tubería del oponente:", error);
                });

                // Cargar skin de fondo del oponente
                loadBackgroundSkin(opponentId).then(imageUrl => {
                    if (imageUrl) {
                        opponentBackgroundImg.src = imageUrl;
                        opponentBackground = opponentBackgroundImg; // Asignar la imagen
                        console.log(`🎨 LOBBY_INFO: Imagen de fondo del oponente asignada: ${imageUrl}`);
                    } else {
                        opponentBackground = "skyblue"; // Usar color por defecto
                        console.warn("⚠️ LOBBY_INFO: No se recibió URL de imagen de fondo para el oponente.");
                    }
                }).catch(error => {
                    console.error("❌ LOBBY_INFO: Error cargando skin de fondo del oponente:", error);
                });

                break;

            case "ALL_PLAYERS_READY":
                bothPlayersReady = true;
                console.log("🎉 ALL_PLAYERS_READY: Ambos jugadores listos.");
                startCountdown();
                break;

            case "GAME_START":
                console.log("🚀 GAME_START: Señal de inicio de juego recibida.");
                startGame();
                break;

            case "PLAYER_POSITION":
                if (message.userId !== userId) {
                    opponentBird.y = (message.y / message.boardHeight) * OPPONENT_CANVAS_HEIGHT;
                    document.getElementById("opponent-score").textContent = message.score;
                    updateOpponentPipes(message.pipes, message.boardWidth, message.boardHeight);
                    // Actualizar posición del fondo del oponente (escalado)
                    opponentBackgroundX = (message.backgroundX / message.boardWidth) * OPPONENT_CANVAS_WIDTH;
                }
                break;

            case "PLAYER_JUMP":
                if (message.userId !== userId) {
                    // Animación de salto del oponente (opcional)
                }
                break;

            case "GAME_OVER":
                if (message.userId !== userId) {
                    opponentGameOver = true;
                    console.log("💀 GAME_OVER: Oponente ha terminado el juego.");
                    checkEndGame();
                }
                break;

            case "PLAYER_DISCONNECTED":
                if (gameRunning) {
                    showGameMessage("¡El oponente se desconectó!", "¡Victoria!");
                    setTimeout(() => {
                        window.location.href = 'MainMenu.html';
                    }, 3000);
                } else {
                    showGameMessage("El oponente se desconectó", "Volviendo al menú...");
                    setTimeout(() => {
                        window.location.href = 'MainMenu.html';
                    }, 2000);
                }
                break;
        }
    }

    // Actualizar las tuberías en miniatura del oponente
    function updateOpponentPipes(pipes, origWidth, origHeight) {
        opponentPipeArray = pipes.map(pipe => {
            // Escalar las coordenadas y dimensiones al tamaño del canvas del oponente
            const scaledX = (pipe.x / origWidth) * OPPONENT_CANVAS_WIDTH;
            const scaledY = (pipe.y / origHeight) * OPPONENT_CANVAS_HEIGHT;
            const scaledWidth = (pipe.width / origWidth) * OPPONENT_CANVAS_WIDTH;
            const scaledHeight = (pipe.height / origHeight) * OPPONENT_CANVAS_HEIGHT;

            return {
                x: scaledX,
                y: scaledY,
                width: scaledWidth,
                height: scaledHeight,
                // Usar la imagen de tubería del oponente, asumiendo que el `rotated` define si es top/bottom
                img: opponentBottomPipeImg, // Siempre usa la bottom para rotar
                rotated: pipe.rotated // Importante: mantén la propiedad de rotación
            };
        });
    }

    // Iniciar cuenta regresiva
    function startCountdown() {
        console.log("⏰ Iniciando countdown...");
        const countdownElement = document.getElementById("countdown");
        countdownElement.style.display = "block";
        countdownElement.textContent = countdown;

        countdownTimer = setInterval(() => {
            countdown--;
            console.log("⏰ Countdown:", countdown);
            countdownElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(countdownTimer);
                countdownElement.style.display = "none";
                console.log("🚀 Countdown terminado, iniciando juego...");

                // Iniciar juego directamente o enviar señal si soy host
                if (isHost || !socket) { // Si eres el host o no hay socket (modo local), inicias.
                    startGame();
                } else { // Si eres el invitado, esperas la señal del host o envías una señal de listo.
                    socket.send(JSON.stringify({
                        type: "GAME_START",
                        lobbyId: lobbyId
                    }));
                }
            }
        }, 1000);
    }

    // Función para dibujar el fondo con scrolling para el JUGADOR LOCAL
    function drawBackground() {
        if (background instanceof Image && background.complete) {
            let imgWidth = board.width;
            let imgHeight = board.height;

            ctx.drawImage(background, backgroundX, 0, imgWidth, imgHeight);
            ctx.drawImage(background, backgroundX + imgWidth, 0, imgWidth, imgHeight);

            if (backgroundX <= -imgWidth) {
                backgroundX = 0;
            }
        } else if (typeof background === 'string') {
            ctx.fillStyle = background;
            ctx.fillRect(0, 0, board.width, board.height);
        } else {
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, board.width, board.height);
        }
    }

    // Función para dibujar el fondo con scrolling para el OPONENTE
    function drawOpponentBackground() {
        if (opponentBackground instanceof Image && opponentBackground.complete) {
            let imgWidth = OPPONENT_CANVAS_WIDTH;
            let imgHeight = OPPONENT_CANVAS_HEIGHT;

            opponentCtx.drawImage(opponentBackground, opponentBackgroundX, 0, imgWidth, imgHeight);
            opponentCtx.drawImage(opponentBackground, opponentBackgroundX + imgWidth, 0, imgWidth, imgHeight);

            if (opponentBackgroundX <= -imgWidth) {
                opponentBackgroundX = 0;
            }
        } else if (typeof opponentBackground === 'string') {
            opponentCtx.fillStyle = opponentBackground;
            opponentCtx.fillRect(0, 0, OPPONENT_CANVAS_WIDTH, OPPONENT_CANVAS_HEIGHT);
        } else {
            opponentCtx.fillStyle = "skyblue";
            opponentCtx.fillRect(0, 0, OPPONENT_CANVAS_WIDTH, OPPONENT_CANVAS_HEIGHT);
        }
    }

    // Función para dibujar la tubería con rotación (uso general)
    function drawPipe(ctxToUse, pipe) {
        if (!pipe.img.complete || pipe.img.naturalWidth === 0) {
            // Fallback si la imagen no está cargada
            ctxToUse.fillStyle = pipe.rotated ? "darkgreen" : "green";
            ctxToUse.fillRect(pipe.x, pipe.y, pipe.width, pipe.height);
            return;
        }

        ctxToUse.save();
        ctxToUse.translate(pipe.x + pipe.width / 2, pipe.y + pipe.height / 2);

        if (pipe.rotated) {
            ctxToUse.rotate(Math.PI); // Rota 180 grados (pi radianes)
        }

        ctxToUse.drawImage(pipe.img, -pipe.width / 2, -pipe.height / 2, pipe.width, pipe.height);
        ctxToUse.restore();
    }


    // Iniciar juego
    async function startGame() {
        console.log("🎬 ¡INICIANDO startGame()!");
        gameRunning = true;

        // Cargar imagen del pájaro del jugador local
        birdImg.src = await loadBirdSkin(userId);
        console.log(`🎨 startGame: Pájaro del jugador local (userId=${userId}) cargado: ${birdImg.src}`);


        // Importante: Asegurarse de que la imagen del pájaro del oponente se haya cargado antes de iniciar el bucle de animación
        // Esto es una medida de seguridad en caso de que la promesa de LOBBY_INFO no se haya resuelto todavía.
        if (opponentId && !opponentBirdImg.complete) { // Solo intentar cargar si opponentId existe y la imagen no está completa
            console.log(`⚠️ startGame: Oponente ID disponible (${opponentId}) pero imagen no completa. Reintentando carga de pájaro...`);
            const opponentImageUrl = await loadBirdSkin(opponentId);
            if (opponentImageUrl) {
                opponentBirdImg.src = opponentImageUrl;
                console.log(`✅ startGame: Imagen del pájaro del oponente (opponentId=${opponentId}) recargada y asignada: ${opponentImageUrl}`);
            } else {
                console.warn(`❌ startGame: Falló la recarga de la imagen del oponente para ID ${opponentId}.`);
            }
        } else if (opponentId && opponentBirdImg.complete) {
            console.log(`✔️ startGame: Imagen del oponente (ID=${opponentId}) ya estaba cargada.`);
        } else {
            console.log(`ℹ️ startGame: opponentId no disponible o no es necesario cargar imagen del oponente.`);
        }

        // Medida de seguridad para pipes y fondo del oponente, por si no cargaron en LOBBY_INFO
        if (opponentId) {
            if (!opponentBackgroundImg.complete && !opponentBackgroundImg.src) { // Si no está cargada y no tiene src asignado
                console.log(`⚠️ startGame: Fondo de oponente no cargado. Reintentando carga...`);
                const oppBgUrl = await loadBackgroundSkin(opponentId);
                if (oppBgUrl) {
                    opponentBackgroundImg.src = oppBgUrl;
                    opponentBackground = opponentBackgroundImg;
                    console.log(`✅ startGame: Fondo del oponente recargado y asignado: ${oppBgUrl}`);
                }
            }
            if (!opponentBottomPipeImg.complete && !opponentBottomPipeImg.src) { // Si no está cargada y no tiene src asignado
                console.log(`⚠️ startGame: Tubería de oponente no cargada. Reintentando carga...`);
                const oppPipeUrl = await loadPipeSkin(opponentId);
                if (oppPipeUrl) {
                    opponentBottomPipeImg.src = oppPipeUrl;
                    opponentTopPipeImg.src = oppPipeUrl; // Ambas usan la misma
                    console.log(`✅ startGame: Tubería del oponente recargada y asignada: ${oppPipeUrl}`);
                }
            }
        }


        // Agregar event listeners
        document.addEventListener("keydown", moveBird);
        document.addEventListener("touchstart", handleTouchStart);

        // Resetear variables del juego
        bird.x = boardWidth / 8;
        bird.y = boardHeight / 2;
        velocityY = 0;
        pipeArray = [];
        score = 0;
        gameOver = false;
        localGameOver = false;
        velocityX = -2; // Restablecer a la velocidad inicial para el juego

        pipeX = boardWidth; // Las tuberías salen desde el borde derecho
        backgroundX = 0; // Reinicia la posición del fondo para el jugador local
        opponentBackgroundX = 0; // Reinicia la posición del fondo para el oponente


        // Limpiar intervalo anterior y crear nuevo
        clearInterval(pipeInterval);
        pipeInterval = setInterval(placePipes, 1800);

        console.log("🚀 Comenzando loop de juego...");
        requestAnimationFrame(update);
    }

    // Bucle principal del juego
    function update() {

        if (localGameOver) {
            console.log("🛑 Juego terminado localmente, deteniendo update.");
            return;
        }

        // Limpiar canvas principal
        ctx.clearRect(0, 0, board.width, board.height);
        // Limpiar canvas del oponente
        opponentCtx.clearRect(0, 0, OPPONENT_CANVAS_WIDTH, OPPONENT_CANVAS_HEIGHT);

        // Actualiza la posición del fondo para el scrolling (jugador local)
        backgroundX += velocityX;

        // Fondo usando la nueva función para el jugador local
        drawBackground();


        // Actualizar posición del pájaro (jugador local)
        velocityY += gravity;
        bird.y = Math.max(bird.y + velocityY, 0);


        // Dibujar pájaro principal
        if (birdImg.complete && birdImg.naturalWidth > 0) {
            ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
        } else {
            ctx.fillStyle = "yellow";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
        }

        // Dibuja el fondo del oponente
        drawOpponentBackground();

        // Dibujar pájaro del oponente
        if (opponentBirdImg.complete && opponentBirdImg.naturalWidth > 0) {
            opponentCtx.drawImage(opponentBirdImg, opponentBird.x, opponentBird.y, opponentBird.width, opponentBird.height);
        } else {
            opponentCtx.fillStyle = "red";
            opponentCtx.fillRect(opponentBird.x, opponentBird.y, opponentBird.width, opponentBird.height);
            console.warn("⚠️ Oponente no cargado o no listo para dibujar. complete=", opponentBirdImg.complete, "naturalWidth=", opponentBirdImg.naturalWidth);
        }

        // Verificar si el pájaro tocó el suelo
        if (bird.y > board.height) {
            console.log("💥 El pájaro tocó el suelo");
            gameOver = true;
            localGameOver = true;
            handleGameOver();
            return;
        }

        // Actualizar tuberías del jugador local
        for (let i = 0; i < pipeArray.length; i++) {
            let pipe = pipeArray[i];
            pipe.x += velocityX;
            drawPipe(ctx, pipe); // Usar la función drawPipe para las tuberías del jugador local

            if (!pipe.passed && bird.x > pipe.x + pipe.width) {
                score += 0.5;
                document.getElementById("player-score").textContent = Math.floor(score);
                pipe.passed = true;
                console.log("✨ Punto! Score:", Math.floor(score));
            }

            // Verificar colisión
            if (detectCollision(bird, pipe)) {
                console.log("💥 Colisión detectada con tubería");
                gameOver = true;
                localGameOver = true;
                handleGameOver();
                return;
            }
        }

        // Ajuste muy sutil de aceleración (opcional)
        if (velocityX > -2.5) { // Si la velocidad es menor que -2.5 (más rápida), la incrementa (hace más lenta)
            velocityX -= 0.0003; // Ajusta este valor para controlar la aceleración
        }

        // Eliminar tuberías que salieron de pantalla del jugador local
        while (pipeArray.length > 0 && pipeArray[0].x < -pipeWidth) {
            pipeArray.shift();
        }

        // Dibujar tuberías del oponente
        for (let i = 0; i < opponentPipeArray.length; i++) {
            let pipe = opponentPipeArray[i];
            // Usamos drawPipe para las tuberías del oponente también
            drawPipe(opponentCtx, pipe);
        }

        // Enviar posición si hay conexión WebSocket
        if (gameRunning && !localGameOver && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "PLAYER_POSITION",
                userId: userId,
                lobbyId: lobbyId,
                x: bird.x,
                y: bird.y,
                boardWidth: boardWidth,
                boardHeight: boardHeight,
                score: Math.floor(score),
                backgroundX: backgroundX, // Enviar la posición del fondo también
                pipes: pipeArray.map(pipe => ({
                    x: pipe.x,
                    y: pipe.y,
                    width: pipe.width,
                    height: pipe.height,
                    // Ya no necesitamos isTop, el rotated indica qué imagen usar (la misma y rotarla)
                    rotated: pipe.rotated // Enviar el estado de rotación
                }))
            }));
        }

        // Continuar el loop
        requestAnimationFrame(update);
    }

    // Generar nuevas tuberías
    function placePipes() {
        if (localGameOver || !gameRunning) return;

        console.log("🚪 Generando nueva tubería");
        let randomPipeY = -pipeHeight / 4 - Math.random() * (pipeHeight / 2);

        // Tubería superior (no rotada)
        pipeArray.push({
            img: bottomPipeImg, // Usamos bottomPipeImg para ambas y rotamos la que sea necesaria
            x: pipeX,
            y: randomPipeY,
            width: pipeWidth,
            height: pipeHeight,
            passed: false,
            rotated: false // No rotada
        });

        // Tubería inferior (rotada 180°)
        pipeArray.push({
            img: bottomPipeImg, // Misma imagen
            x: pipeX,
            y: randomPipeY + pipeHeight + openingSpace,
            width: pipeWidth,
            height: pipeHeight,
            passed: false,
            rotated: true // Rotada
        });
    }

    // Manejar salto del pájaro (teclado)
    function moveBird(e) {
        if (["Space", "ArrowUp", "KeyX"].includes(e.code) && gameRunning && !localGameOver) {
            console.log("🦅 ¡Salto!");
            velocityY = -6;

            // Enviar evento de salto si hay conexión
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "PLAYER_JUMP",
                    userId: userId,
                    lobbyId: lobbyId
                }));
            }
        }
    }

    // Manejar salto del pájaro (móvil)
    function handleTouchStart(e) {
        if (gameRunning && !localGameOver) {
            e.preventDefault();
            console.log("📱 ¡Toque en móvil!");
            velocityY = -6;

            // Enviar evento de salto si hay conexión
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "PLAYER_JUMP",
                    userId: userId,
                    lobbyId: lobbyId
                }));
            }
        }
    }

    // Verificar colisión
    function detectCollision(a, b) {
        return a.x < b.x + b.width &&
            a.x + a.width > b.x &&
            a.y < b.y + b.height &&
            a.y + a.height > b.y;
    }

    // Manejar fin de juego
    function handleGameOver() {
        console.log("💀 Game Over! Score final:", Math.floor(score));

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "GAME_OVER",
                userId: userId,
                lobbyId: lobbyId,
                score: Math.floor(score)
            }));
        }

        checkEndGame();
    }

    // Verificar si ambos jugadores terminaron
    function checkEndGame() {
        // En modo local, terminar inmediatamente
        if (!socket) {
            showFinalResults();
            return;
        }

        if (localGameOver && opponentGameOver) {
            showFinalResults();
        }
    }

    // Mostrar resultados finales
    function showFinalResults() {
        const myScore = Math.floor(score);
        const opponentScore = parseInt(document.getElementById("opponent-score").textContent) || 0;
        const winnerElement = document.getElementById("winner");
        let result;

        if (myScore > opponentScore) {
            winnerElement.textContent = "¡GANASTE!\n" + myScore + " - " + opponentScore;
            result = `${userId}_win`;
        } else if (myScore < opponentScore) {
            winnerElement.textContent = "¡PERDISTE!\n" + myScore + " - " + opponentScore;
            result = `${opponentId}_win`;
        } else {
            winnerElement.textContent = "¡EMPATE!\n" + myScore + " - " + opponentScore;
            result = "draw";
        }

        // Función para enviar el resultado del juego al servidor
        async function lobbyResult(result) {
            try {
                console.log("📊 Enviando resultado del juego:", result);

                const response = await fetch(`${BASE_URL}/lobby/${lobbyId}/result`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        result: result,
                        myScore: Math.floor(score),
                        opponentScore: parseInt(document.getElementById("opponent-score").textContent) || 0,
                        userId: userId,
                        opponentId: opponentId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    console.log("✅ Resultado enviado correctamente:", data);
                } else {
                    console.error("❌ Error enviando resultado:", data.message);
                }
            } catch (error) {
                console.error("❌ Error de red enviando resultado:", error);
            }
        }

        lobbyResult(result);

        winnerElement.style.display = "block";

        // Guardar puntuación localmente
        localStorage.setItem('lastScore', myScore);

        setTimeout(() => {
            window.location.href = 'MainMenu.html';
        }, 5000);
    }

    // Función para manejar el redimensionamiento de la ventana
    function handleResize() {
        boardWidth = window.innerWidth;
        boardHeight = window.innerHeight;
        board.width = boardWidth;
        board.height = boardHeight;

        // Ajustar posición del pájaro
        if (!gameRunning) {
            bird.x = boardWidth / 8;
            bird.y = boardHeight / 2;
        }
    }

    // Mostrar mensaje durante el juego
    function showGameMessage(mainText, subText = "") {
        let msgContainer = document.getElementById("game-message");
        if (!msgContainer) {
            msgContainer = document.createElement("div");
            msgContainer.id = "game-message";
            msgContainer.style.position = "absolute";
            msgContainer.style.top = "50%";
            msgContainer.style.left = "50%";
            msgContainer.style.transform = "translate(-50%, -50%)";
            msgContainer.style.backgroundColor = "rgba(0, 0, 0, 0.8)";
            msgContainer.style.color = "white";
            msgContainer.style.padding = "30px";
            msgContainer.style.borderRadius = "15px";
            msgContainer.style.fontFamily = "'Press Start 2P', cursive";
            msgContainer.style.textAlign = "center";
            msgContainer.style.zIndex = "1000";
            msgContainer.style.width = "80%";
            msgContainer.style.maxWidth = "500px";
            document.body.appendChild(msgContainer);
        }

        msgContainer.innerHTML = `
            <div style="font-size: 24px; margin-bottom: 15px;">${mainText}</div>
            ${subText ? `<div style="font-size: 18px; color: gold;">${subText}</div>` : ''}
        `;

        msgContainer.style.display = "block";
    }

    // Limpiar recursos al salir de la página
    window.addEventListener('beforeunload', () => {
        manualDisconnect = true;
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
        }
        clearInterval(pipeInterval);
        clearTimeout(reconnectTimeout);
    });

    // Inicializar el juego
    window.addEventListener('resize', handleResize);

    // Inicializar
    console.log("🎯 Iniciando aplicación...");
    initWebSocket();

    // Cargar skins del jugador LOCAL al inicio
    if (userId) {
        loadBirdSkin(userId).then(imageUrl => {
            console.log("🎨 Skin del jugador cargada:", imageUrl);
            if (imageUrl) {
                birdImg.src = imageUrl;
                bird.imgSrc = imageUrl;
            }
        });

        loadPipeSkin(userId).then(imageUrl => {
            console.log("🎨 Skin de tubería cargada:", imageUrl);
            if (imageUrl) {
                bottomPipeImg.src = imageUrl;
                topPipeImg.src = imageUrl;
            }
        });

        loadBackgroundSkin(userId).then(imageUrl => {
            console.log("🎨 Skin de fondo cargada:", imageUrl);
            if (imageUrl) {
                backgroundImg.src = imageUrl;
                background = backgroundImg;
            } else {
                console.log("No se recibió image_url de fondo, usando color por defecto");
                background = "skyblue";
            }
        });
    }

</script>
