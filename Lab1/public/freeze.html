<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuenta Bloqueada - Arcade Edition</title>
  <script src="/env.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #383838; /* Darker, almost black for arcade cabinet feel */
      color: #FFFFFF; /* White for main text */
      font-family: 'Press Start 2P', cursive; /* The quintessential pixel font */
      text-align: center;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      /* Optional: subtle pixel background texture */
      background-image:
              repeating-linear-gradient(0deg, #222 0px, #222 1px, transparent 1px, transparent 2px),
              repeating-linear-gradient(90deg, #222 0px, #222 1px, transparent 1px, transparent 2px);
      background-size: 2px 2px;
    }
    .arcade-screen {
      max-width: 500px; /* Constrain width to mimic screen */
      width: 90%; /* Responsive width */
      padding: 30px;
      background-color: #000000; /* Black screen */
      border: 8px solid #888888; /* Arcade cabinet border */
      border-radius: 15px; /* Slightly rounded corners */
      box-shadow:
              0 0 0 10px #555555, /* Outer cabinet glow */
              0 0 0 18px #444444, /* Even outerer glow */
              inset 0 0 20px rgba(0, 255, 0, 0.4); /* Green screen effect */
      animation: scanline 0.5s infinite steps(1); /* Subtle scanline effect */
    }
    h1 {
      color: #FFFF00; /* Bright yellow, classic arcade color */
      font-size: 28px; /* Slightly adjusted for pixel readability */
      margin-bottom: 15px;
      text-shadow: 2px 2px 0 #FF0000; /* Red shadow for pop */
    }
    p {
      font-size: 14px; /* Pixelated font needs to be a bit smaller */
      margin-bottom: 25px;
      color: #00FF00; /* Green text for a classic arcade feel */
      line-height: 1.6; /* Adjust line height for readability */
    }
    .frozen-icon {
      font-size: 70px; /* Adjusted size for pixel icon */
      margin-bottom: 20px;
      color: #00FFFF; /* Cyan/Light Blue for icy pixel */
      animation: bouncePixel 0.8s infinite alternate ease-in-out; /* Pixel bounce animation */
      text-shadow: 2px 2px 0 #00AAAA; /* Shadow for depth */
      -webkit-font-smoothing: none; /* Crucial for sharp pixel appearance */
      image-rendering: pixelated; /* Ensure icon stays pixelated */
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    button {
      font-family: 'Press Start 2P', cursive;
      padding: 10px 20px;
      background-color: #00CC00; /* Bright green button */
      border: 4px solid #009900; /* Darker green border */
      border-radius: 5px; /* Blockier corners */
      color: #FFFFFF; /* White text */
      font-size: 16px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #006600; /* Chunky shadow */
      transition: all 0.1s ease-out; /* Quick transition */
    }
    button:hover {
      background-color: #00FF00; /* Lighter green on hover */
      box-shadow: 2px 2px 0 #009900; /* Smaller shadow on hover */
      transform: translate(2px, 2px); /* Simulate button press */
    }
    button:active {
      background-color: #009900;
      box-shadow: none;
      transform: translate(4px, 4px);
    }

    /* Keyframes for pixel animations */
    @keyframes bouncePixel {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    @keyframes scanline {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 100%; }
    }
  </style>
</head>
<body>

<div class="arcade-screen">
  <div class="frozen-icon">🧊</div> <h1>¡CUENTA BLOQUEADA!</h1>

  <p>TU CUENTA HA SIDO CONGELADA.<br>VERIFICA TU EMAIL.</p>

  <button onclick="logout()">Cerrar Sesión</button>
</div>

<script>
  // Ensure BASE_URL is defined if used elsewhere
  const BASE_URL = window.ENV ? window.ENV.BASE_URL : '';
  function logout() {
    localStorage.removeItem('token');
    // Simulate Flappy Bird game over redirect
    window.location.href = 'WebMenu.html?game_over=true';
  }
</script>

</body>
</html>
