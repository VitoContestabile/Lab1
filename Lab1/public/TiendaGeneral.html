<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <script src="/env.js"></script>
    <script>
        const BASE_URL = window.ENV.BASE_URL;
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Variables para colores consistentes */
        :root {
            --primary-color: #ffcc00;
            --secondary-color: #ffaa00;
            --dark-accent: #222034;
            --light-accent: #8bcdff;
            --sky-bg: #73c8f0;
            --neon-yellow: #fff700;
            --neon-blue: #00d4ff;
            --shadow-dark: rgba(0, 0, 0, 0.4);
        }

        /* Estilos globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo de la página con gradiente animado */
        body {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(45deg,
                #ff6b9d 0%,
                #c44569 20%,
                #f8b500 40%,
                #73c8f0 60%,
                #4834d4 80%,
                #ff6b9d 100%);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flotantes */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-yellow);
            border-radius: 50%;
            pointer-events: none;
            animation: float-particles 8s infinite linear;
            box-shadow: 0 0 10px var(--neon-yellow);
        }

        @keyframes float-particles {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal con efectos mejorados */
        #main-menu {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeInScale 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Logo con efectos de neón */
        h1 {
            font-size: 60px;
            color: white;
            text-shadow:
                0 0 10px var(--neon-yellow),
                0 0 20px var(--neon-yellow),
                0 0 30px var(--neon-yellow),
                4px 4px 0px var(--dark-accent),
                8px 8px 0px var(--shadow-dark);
            margin-bottom: 50px;
            transform-origin: center;
            animation: neonPulse 3s infinite ease-in-out;
            letter-spacing: 3px;
            position: relative;
        }

        @keyframes neonPulse {
            0%, 100% {
                transform: scale(1);
                text-shadow:
                    0 0 10px var(--neon-yellow),
                    0 0 20px var(--neon-yellow),
                    0 0 30px var(--neon-yellow),
                    4px 4px 0px var(--dark-accent),
                    8px 8px 0px var(--shadow-dark);
            }
            50% {
                transform: scale(1.08);
                text-shadow:
                    0 0 15px var(--neon-yellow),
                    0 0 25px var(--neon-yellow),
                    0 0 35px var(--neon-yellow),
                    0 0 45px var(--neon-yellow),
                    4px 4px 0px var(--dark-accent),
                    8px 8px 0px var(--shadow-dark);
            }
        }

        /* Contenedor de botones con efectos */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 10;
        }

        /* Estilo mejorado de los botones */
        button {
            width: 320px;
            font-size: 18px;
            font-family: 'Press Start 2P', cursive;
            padding: 20px 25px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--dark-accent);
            box-shadow:
                0 8px 0 var(--secondary-color),
                0 12px 20px var(--shadow-dark),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        /* Efecto de brillo en los botones */
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        /* Botón Pájaros con efectos mejorados */
        #pajaros-btn {
            background: linear-gradient(135deg, #ff6b6b, #e74c3c);
            box-shadow:
                0 8px 0 #c0392b,
                0 12px 20px rgba(192, 57, 43, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        #pajaros-btn:hover {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 12px 0 #a93226,
                0 16px 25px rgba(169, 50, 38, 0.5),
                0 0 20px rgba(231, 76, 60, 0.6);
        }

        /* Botón Tubos con efectos mejorados */
        #tubos-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow:
                0 8px 0 #1e8449,
                0 12px 20px rgba(30, 132, 73, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        #tubos-btn:hover {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 12px 0 #186a3b,
                0 16px 25px rgba(24, 106, 59, 0.5),
                0 0 20px rgba(39, 174, 96, 0.6);
        }

        /* Botón Fondos con efectos mejorados */
        #fondos-btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            box-shadow:
                0 8px 0 #7d3c98,
                0 12px 20px rgba(125, 60, 152, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        #fondos-btn:hover {
            background: linear-gradient(135deg, #8e44ad, #7d3c98);
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 12px 0 #6c3483,
                0 16px 25px rgba(108, 52, 131, 0.5),
                0 0 20px rgba(142, 68, 173, 0.6);
        }

        /* Efecto al hacer clic */
        button:active {
            transform: translateY(2px) scale(0.98);
            box-shadow:
                0 4px 0 var(--secondary-color),
                0 6px 10px var(--shadow-dark);
        }

        /* Iconos mejorados */
        .bird-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            left: -70px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: radial-gradient(circle, #fff700, #ffaa00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            top: 50%;
            transform: translateY(-50%) rotate(0deg);
            box-shadow:
                0 0 15px rgba(255, 247, 0, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover .bird-icon {
            opacity: 1;
            transform: translateY(-50%) translateX(-15px) rotate(360deg) scale(1.2);
        }

        /* Mostrador de monedas mejorado */
        #coin-display {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ff8c00);
            border-radius: 30px;
            padding: 12px 20px;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(255, 215, 0, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.4);
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            border: 3px solid #fff;
            color: var(--dark-accent);
            animation: coinFloat 3s infinite ease-in-out;
            backdrop-filter: blur(10px);
        }

        @keyframes coinFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow:
                    0 8px 20px rgba(0, 0, 0, 0.4),
                    0 0 30px rgba(255, 215, 0, 0.6);
            }
            50% {
                transform: translateY(-8px) scale(1.05);
                box-shadow:
                    0 12px 25px rgba(0, 0, 0, 0.5),
                    0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        #coin-display img {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            animation: coinSpin 3s infinite linear;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        @keyframes coinSpin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Botón de regreso mejorado */
        #back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            font-family: 'Press Start 2P', cursive;
            padding: 12px 16px;
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            border: 3px solid #fff;
            border-radius: 10px;
            font-size: 12px;
            box-shadow:
                0 6px 0 #ff8c00,
                0 8px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
            cursor: pointer;
            color: var(--dark-accent);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        #back-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow:
                0 8px 0 #ff8c00,
                0 12px 20px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 204, 0, 0.6);
        }

        #back-btn:active {
            transform: translateY(1px) scale(1.05);
        }

        /* Nubes con efectos mejorados */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
        }

        .cloud1 {
            width: 180px;
            height: 70px;
            top: 15%;
            left: 10%;
            animation: cloudFloat1 25s infinite ease-in-out;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 15px;
        }

        .cloud2 {
            width: 140px;
            height: 50px;
            top: 25%;
            right: 15%;
            animation: cloudFloat2 20s infinite ease-in-out reverse;
        }

        .cloud3 {
            width: 160px;
            height: 60px;
            top: 70%;
            left: 75%;
            animation: cloudFloat1 30s infinite ease-in-out;
        }

        @keyframes cloudFloat1 {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(30px) translateY(-15px); }
            50% { transform: translateX(60px) translateY(0); }
            75% { transform: translateX(30px) translateY(15px); }
        }

        @keyframes cloudFloat2 {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-40px) translateY(20px); }
        }

        /* Pájaros volando mejorados */
        .flying-bird {
            position: absolute;
            width: 35px;
            height: 25px;
            z-index: 2;
            animation: birdFly 30s infinite linear;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
        }

        .flying-bird::before {
            content: '🐦';
            font-size: 24px;
            animation: birdFlap 0.5s infinite alternate;
        }

        @keyframes birdFly {
            0% {
                left: -60px;
                transform: translateY(0) scale(1);
            }
            25% { transform: translateY(-20px) scale(1.1); }
            50% { transform: translateY(10px) scale(0.9); }
            75% { transform: translateY(-15px) scale(1.05); }
            100% {
                left: calc(100% + 60px);
                transform: translateY(0) scale(1);
            }
        }

        @keyframes birdFlap {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.8); }
        }

        .bird1 {
            top: 20%;
            animation-duration: 35s;
            animation-delay: 0s;
        }
        .bird2 {
            top: 40%;
            animation-duration: 25s;
            animation-delay: 8s;
        }
        .bird3 {
            top: 65%;
            animation-duration: 40s;
            animation-delay: 15s;
        }

        /* Efectos de resplandor general */
        #main-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 255, 255, 0.1) 0%,
                transparent 70%
            );
            pointer-events: none;
            animation: glowPulse 4s infinite ease-in-out;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Responsive design mejorado */
        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            button {
                width: 280px;
                font-size: 16px;
                padding: 16px 20px;
            }
            #coin-display {
                font-size: 14px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas flotantes -->
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
    <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 6s;"></div>
    <div class="particle" style="left: 80%; animation-delay: 7s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 1.5s;"></div>

    <div id="main-menu">
        <!-- Botón de regreso -->
        <button id="back-btn">← VOLVER</button>

        <!-- Nubes decorativas mejoradas -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Pájaros volando mejorados -->
        <div class="flying-bird bird1"></div>
        <div class="flying-bird bird2"></div>
        <div class="flying-bird bird3"></div>

        <!-- Título principal -->
        <h1>TIENDA</h1>

        <!-- Contenedor de botones -->
        <div class="button-container">
            <button id="pajaros-btn">
                <div class="bird-icon">🐦</div>
                PÁJAROS
            </button>
            <button id="tubos-btn">
                <div class="bird-icon">🟢</div>
                TUBOS
            </button>
            <button id="fondos-btn">
                <div class="bird-icon">🌅</div>
                FONDOS
            </button>
        </div>
    </div>

    <!-- Mostrador de monedas -->
    <div id="coin-display">
        <img src="assets/coin.jpg" alt="Moneda" />
        <span id="coin-count">0</span>
    </div>

    <script>
        function getUserId(){
            const token = localStorage.getItem("token");
            return parseJwt(token).userId;
        }

        if(!localStorage.getItem("token")){
            navigateTo("WebMenu.html");
        }

        function navigateTo(page) {
            window.location.href = page;
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            const token = localStorage.getItem("token");
            if (!token) {
                navigateTo("WebMenu.html")
            }
            const userId = parseJwt(token).userId

            async function updateCoinDisplay(userId) {
                const res = await fetch(`${BASE_URL}/user/get-coins`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({id: userId})
                });

                const data = await res.json();
                document.getElementById("coin-count").textContent = data.coins;
            }

            await updateCoinDisplay(userId);

            // Crear partículas adicionales dinámicamente
            function createRandomParticles() {
                const particleCount = 5;
                for(let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 8 + 's';
                    particle.style.animationDuration = (6 + Math.random() * 4) + 's';
                    document.body.appendChild(particle);

                    // Remover la partícula después de la animación
                    setTimeout(() => {
                        if(particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 10000);
                }
            }

            // Crear partículas cada 3 segundos
            setInterval(createRandomParticles, 3000);
        });

        // Funcionalidad de los botones con efectos de sonido simulados
        document.getElementById('pajaros-btn').addEventListener('click', function() {
            console.log('Navegando a sección Pájaros');
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                navigateTo("shop.html");
            }, 150);
        });

        document.getElementById('tubos-btn').addEventListener('click', function() {
            console.log('Navegando a sección Tubos');
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                navigateTo("PipeShop.html");
            }, 150);
        });

        document.getElementById('fondos-btn').addEventListener('click', function() {
            console.log('Navegando a sección Fondos');
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                navigateTo("BackgroundShop.html");
            }, 150);
        });

        document.getElementById('back-btn').addEventListener('click', function() {
            console.log('Regresando al menú principal');
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                navigateTo('MainMenu.html');
            }, 150);
        });

        // Efectos de hover mejorados
        const buttons = document.querySelectorAll('button');
        buttons.forEach(button => {
            button.addEventListener('mouseenter', function() {
                console.log('Hover effect on:', button.textContent);
                // Efecto de vibración sutil
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = '';
                }, 10);
            });
        });

        // Efecto de paralaje sutil para las nubes
        document.addEventListener('mousemove', function(e) {
            const clouds = document.querySelectorAll('.cloud');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            clouds.forEach((cloud, index) => {
                const speed = (index + 1) * 0.02;
                const x = (mouseX - 0.5) * speed * 100;
                const y = (mouseY - 0.5) * speed * 50;
                cloud.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
