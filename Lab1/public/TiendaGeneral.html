<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <script src="/env.js"></script>
  <script>
    const BASE_URL = window.ENV.BASE_URL;
  </script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Variables para colores consistentes */
        :root {
            --primary-color: #ffcc00;
            --secondary-color: #ffaa00;
            --dark-accent: #222034;
            --light-accent: #8bcdff;
            --sky-bg: #73c8f0;
        }

        /* Estilos globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo de la página con gradiente */
        body {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(to bottom, var(--sky-bg) 0%, #e4f5fd 100%);
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* Contenedor principal con animación */
        #main-menu {
            position: absolute;
            width: 100%;
            height: 100vh;
            background: url("/assets/flappybirdbg.png") no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Animación para el menú */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo animado */
        h1 {
            font-size: 60px;
            color: white;
            text-shadow:
                    4px 4px 0px var(--dark-accent),
                    8px 8px 0px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            transform-origin: center;
            animation: pulse 3s infinite ease-in-out;
            letter-spacing: 2px;
        }

        /* Animación para el título */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Contenedor de botones para mejor disposición */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* Icono decorativo de pájaro */
        .bird-icon {
            position: absolute;
            width: 40px;
            height: 40px;
            left: -60px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            background: #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Estilo mejorado de los botones */
        button {
            width: 280px;
            font-size: 18px;
            font-family: 'Press Start 2P', cursive;
            padding: 16px 20px;
            background-color: var(--primary-color);
            color: var(--dark-accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            overflow: hidden;
            box-shadow: 0 4px 0 var(--secondary-color), 0 6px 10px rgba(0,0,0,0.2);
        }

        /* Botón Pájaros - Color específico */
        #pajaros-btn {
            background-color: #ff6b6b;
            box-shadow: 0 4px 0 #d63031, 0 6px 10px rgba(0,0,0,0.2);
        }

        #pajaros-btn:hover {
            background-color: #d63031;
            box-shadow: 0 7px 0 #b71c1c, 0 8px 15px rgba(0,0,0,0.3);
        }

        /* Botón Tubos - Color específico */
        #tubos-btn {
            background-color: #2ecc71;
            box-shadow: 0 4px 0 #27ae60, 0 6px 10px rgba(0,0,0,0.2);
        }

        #tubos-btn:hover {
            background-color: #27ae60;
            box-shadow: 0 7px 0 #1e8449, 0 8px 15px rgba(0,0,0,0.3);
        }

        /* Botón Fondos - Color específico */
        #fondos-btn {
            background-color: #9b59b6;
            box-shadow: 0 4px 0 #8e44ad, 0 6px 10px rgba(0,0,0,0.2);
        }

        #fondos-btn:hover {
            background-color: #8e44ad;
            box-shadow: 0 7px 0 #7d3c98, 0 8px 15px rgba(0,0,0,0.3);
        }

        /* Efecto al pasar el mouse */
        button:hover {
            transform: translateY(-3px);
        }

        /* Mostrar ícono al pasar sobre botón */
        button:hover .bird-icon {
            opacity: 1;
            transform: translateY(-50%) translateX(-10px);
        }

        /* Efecto al hacer clic */
        button:active {
            transform: translateY(3px);
        }

        /* Mostrador de monedas mejorado */
        #coin-display {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 25px;
            padding: 8px 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            border: 3px solid #fff;
            color: var(--dark-accent);
            animation: shimmer 2s infinite alternate;
        }

        /* Animación para el contador de monedas */
        @keyframes shimmer {
            from { box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
            to { box-shadow: 0 4px 15px rgba(255, 215, 0, 0.7); }
        }

        #coin-display img {
            width: 28px;
            height: 28px;
            margin-right: 10px;
            animation: spin 10s infinite linear;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        /* Animación para la moneda */
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Animación para la moneda */
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Nubes decorativas */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            z-index: -1;
        }

        .cloud1 {
            width: 150px;
            height: 60px;
            top: 10%;
            left: 10%;
            animation: float 20s infinite linear;
        }

        .cloud2 {
            width: 100px;
            height: 40px;
            top: 25%;
            right: 15%;
            animation: float 15s infinite linear reverse;
        }

        .cloud3 {
            width: 120px;
            height: 50px;
            top: 60%;
            left: 70%;
            animation: float 25s infinite linear;
        }

        /* Animación para las nubes */
        @keyframes float {
            0% { transform: translateX(0); }
            50% { transform: translateX(50px); }
            100% { transform: translateX(0); }
        }

        /* Pájaros volando en el fondo */
        .flying-bird {
            position: absolute;
            width: 30px;
            height: 20px;
            background: var(--dark-accent);
            z-index: -1;
            animation: fly 25s infinite linear;
            border-radius: 50% 10% 50% 10%;
        }

        .bird1 { top: 15%; animation-duration: 30s; }
        .bird2 { top: 35%; animation-delay: 5s; animation-duration: 20s; }
        .bird3 { top: 65%; animation-delay: 10s; animation-duration: 35s; }

        @keyframes fly {
            0% { left: -50px; transform: translateY(0); }
            50% { transform: translateY(30px); }
            100% { left: calc(100% + 50px); transform: translateY(0); }
        }

        /* Creando un elemento decorativo de tubo de Flappy Bird */
        .pipe-decoration {
            position: absolute;
            right: -100px;
            bottom: 0;
            width: 80px;
            height: 200px;
            background-color: #2ecc71;
            border: 4px solid #27ae60;
            border-radius: 5px 5px 0 0;
            z-index: -1;
        }

        .pipe-top {
            width: 100px;
            height: 20px;
            background-color: #2ecc71;
            border: 4px solid #27ae60;
            border-radius: 5px;
            position: relative;
            top: -10px;
            left: -10px;
        }
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Press Start 2P', cursive;
            padding: 15px 25px;
            background-color: #ffcc00;
            border: 4px solid #ffaa00;
            border-radius: 10px;
            font-size: 12px;
            box-shadow: 4px 4px 0px black;
            cursor: pointer;
            color: var(--dark-accent);
        }

        #back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
        }


    </style>
</head>
<body>
    <div id="main-menu">
        <!-- Botón de regreso -->
        <button id="back-btn">Volver</button>

        <!-- Nubes decorativas -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Pájaros volando -->
        <div class="flying-bird bird1"></div>
        <div class="flying-bird bird2"></div>
        <div class="flying-bird bird3"></div>

        <!-- Título principal -->
        <h1>TIENDA</h1>

        <!-- Contenedor de botones -->
        <div class="button-container">
            <button id="pajaros-btn">
                <div class="bird-icon">🐦</div>
                PÁJAROS
            </button>
            <button id="tubos-btn">
                <div class="bird-icon">🟢</div>
                TUBOS
            </button>
            <button id="fondos-btn">
                <div class="bird-icon">🌅</div>
                FONDOS
            </button>
        </div>

        <!-- Decoración de tubo -->
        <div class="pipe-decoration">
            <div class="pipe-top"></div>
        </div>
    </div>

    <!-- Mostrador de monedas -->
    <div id="coin-display">
      <img src="assets/coin.jpg" alt="Moneda" />
      <span id="coin-count">0</span>
    </div>

    <script>

      function getUserId(){
      const token = localStorage.getItem("token");
      return parseJwt(token).userId;
    }

    if(!localStorage.getItem("token")){
      navigateTo("WebMenu.html");
    }

    function navigateTo(page) {
      window.location.href = page;
    }

        function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }
    document.addEventListener("DOMContentLoaded", async function () {
      const token = localStorage.getItem("token");
      if (!token) {
        navigateTo("WebMenu.html")
      }
      const userId = parseJwt(token).userId

      async function updateCoinDisplay(userId) {
        const res = await fetch(`${BASE_URL}/user/get-coins`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({id: userId})
        });

        const data = await res.json();
        document.getElementById("coin-count").textContent = data.coins;
      }

      await updateCoinDisplay(userId);

    });

        // Funcionalidad de los botones
        document.getElementById('pajaros-btn').addEventListener('click', function() {
            console.log('Navegando a sección Pájaros');
            navigateTo("shop.html")

        });

        document.getElementById('tubos-btn').addEventListener('click', function() {
            console.log('Navegando a sección Tubos');
            navigateTo("PipeShop.html")

        });

        document.getElementById('fondos-btn').addEventListener('click', function() {
            console.log('Navegando a sección Fondos');
            navigateTo("BackgroundShop.html")
        });

        document.getElementById('back-btn').addEventListener('click', function() {
            console.log('Regresando al menú principal');
            navigateTo('MainMenu.html')
        });

        // Efecto de sonido simulado al hacer hover (opcional)
        const buttons = document.querySelectorAll('button');
        buttons.forEach(button => {
            button.addEventListener('mouseenter', function() {
                // Aquí podrías agregar efectos de sonido
                console.log('Hover effect on:', button.textContent);
            });
        });
    </script>
</body>
</html>
